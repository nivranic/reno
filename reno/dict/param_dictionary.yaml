# 参数字典 v1 —— 名称归一 + 单位归一(双层,可行性实验实证⑥:缺名称层则数值冲突检测 0 命中)
# name_variants: 归一参数名; unit_to_mm / unit_to_m: 单位换算表
name_variants:
  淋浴区涂刷高度: 卫生间墙面防水高度
  墙面防水高度: 卫生间墙面防水高度
  翻起高度下限: 卫生间墙面防水高度
  防水高度: 卫生间墙面防水高度
  留缝宽度: 瓷砖留缝宽度
  接缝宽度下限: 瓷砖留缝宽度
  砖缝宽度: 瓷砖留缝宽度
  缝隙宽度: 瓷砖留缝宽度
  涂刷遍数: 防水涂刷遍数
  防水的湿度: 防水涂刷遍数
  总厚度下限: 防水涂层总厚度
  总厚度: 防水涂层总厚度
  闭水时长: 闭水试验时长
  避水试验时长: 闭水试验时长
  插座离地高度: 插座安装高度
  插座高度: 插座安装高度
  排水坡度: 地面排水坡度
  坡度: 地面排水坡度

unit_aliases:
  毫米: mm
  毫米(mm): mm
  mm: mm
  厘米: cm
  公分: cm
  cm: cm
  米: m
  米(m): m
  m: m
  兆帕: MPa
  MPa: MPa
  mpa: MPa
  遍: 遍
  小时: h
  小时(h): h
  h: h

# 归一目标单位:长度类统一 mm(避免 1.8m vs 1800mm 字面不等)
to_mm_units: [mm]
cm_to_mm: 10
m_to_mm: 1000
percent_params: [地面排水坡度]
