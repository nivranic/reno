# Optional reverse proxy for reno (recommended on a public server: TLS terminates
# here, tokens never cross the network in plaintext - the /api gate accepts
# ?token= query strings which MUST NOT travel over plain HTTP).
#
# Install:
#   sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx-reno.conf /etc/nginx/sites-available/reno
#   sudo ln -s /etc/nginx/sites-available/reno /etc/nginx/sites-enabled/reno
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d reno.example.com     # free TLS, auto-renew
#
# Then bind reno to loopback only and reopen the firewall for 80/443:
#   sudo deploy/deploy.sh --host 127.0.0.1 --port 8765 ...   # re-run to update
#   sudo ufw deny 8765 && sudo ufw allow 80,443/tcp

server {
    listen 80;
    listen [::]:80;
    server_name reno.example.com;          # <- change, then let certbot manage TLS

    # sync channel (home agent pushes media + rows, Phase 1): originals run
    # 10-150MB, so this location needs its own body limit; header-only
    # X-Sync-Token auth, gentle rate limit per IP
    limit_req_zone $binary_remote_addr zone=reno_sync:10m rate=30r/m;
    location /api/sync/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 512m;
        limit_req zone=reno_sync burst=10 nodelay;
        proxy_read_timeout 600s;
        proxy_request_buffering off;      # stream large uploads straight through
    }

    # SPA assets are immutable hashed files; index.html revalidates via the app.
    location /assets/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # video evidence streaming goes through /api/video/... with Range
        client_max_body_size 10m;          # /api/import posts URL lists, not files
        proxy_buffering off;               # let Range/206 pass through untouched
        proxy_read_timeout 300s;           # /ask waits on the LLM API (seconds)
    }
}
