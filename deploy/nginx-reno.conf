# managed by reno-deploy v1
# TEMPLATE: render via deploy_support.py render-nginx; do not copy verbatim.
# Included from nginx's http context. Only the named reno site is managed.
limit_req_zone $binary_remote_addr zone=reno_sync:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __RENO_DOMAIN__;
    access_log off; # Legacy media query tokens must never reach access logs.
    location ^~ /.well-known/acme-challenge/ {
        root __RENO_WEBROOT__;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { __RENO_HTTP_FALLBACK__ }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __RENO_DOMAIN__;
    ssl_certificate __RENO_CERTIFICATE__;
    ssl_certificate_key __RENO_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # One 8 KiB metadata value plus its header name exceeds an 8k buffer.
    # Application still enforces the exact 8 KiB metadata bound.
    large_client_header_buffers 4 16k;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    limit_req_status 429;
    error_page 429 = @reno_busy;
    error_page 413 = @reno_too_large;
    error_page 408 504 = @reno_timeout;

    location ^~ /.well-known/acme-challenge/ {
        root __RENO_WEBROOT__;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /api/sync/media {
        client_max_body_size 512m;
        __RENO_SYNC_PROXY__
    }
    location = /api/sync/push {
        # 64 MiB snapshot plus bounded JSON framing; the app checks the exact
        # 64 MiB + 64 KiB maximum, nginx leaves room for this envelope.
        client_max_body_size 65m;
        __RENO_SYNC_PROXY__
    }
    location = /api/sync/uploads/prepare {
        # The sender declares the entire publication's media set, including
        # verified cached files, before any upload begins.
        client_max_body_size 4m;
        __RENO_SYNC_PROXY__
    }
    location ^~ /api/sync/ {
        client_max_body_size 64k;
        __RENO_SYNC_PROXY__
    }

    location @reno_busy {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"code":"SYNC_BUSY","detail":"Sync receiver is busy; retry later"}';
    }
    location @reno_too_large {
        default_type application/json;
        return 413 '{"code":"INVALID_SYNC_REQUEST","detail":"Request body exceeds its limit"}';
    }
    location @reno_timeout {
        default_type application/json;
        return 504 '{"code":"SYNC_UPLOAD_TIMEOUT","detail":"Sync request timed out"}';
    }

    location ~ ^/api/sources/[^/]+/attachments$ {
        client_max_body_size 21m;
        proxy_pass http://127.0.0.1:__RENO_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:__RENO_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_buffering off; # Preserve Range/206 and SSE.
        proxy_read_timeout 300s;
    }
}
